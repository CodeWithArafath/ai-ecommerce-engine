version: "3.8"

services:

  backend:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development


  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    depends_on:
      - backend


  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"


  redis:
    image: redis:latest
    ports:
      - "6379:6379"
